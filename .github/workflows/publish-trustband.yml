# Publish trustband to PyPI without a token existing anywhere.
#
# GitHub mints a short-lived OIDC credential; PyPI trades it for an upload
# token scoped to this one run. Nothing is stored in the repository, nothing
# in Actions secrets, nothing on a laptop. There is no long-lived credential
# to leak or rotate.
#
# ONE-TIME SETUP ON PYPI, before the first run:
#   pypi.org -> Your projects -> Publishing -> "Add a new pending publisher"
#     PyPI project name : trustband
#     Owner             : AAOOAAII
#     Repository name   : the source repository
#     Workflow name     : publish-trustband.yml
#     Environment name  : pypi
#   A "pending publisher" is what lets this create a project that does not
#   exist yet, which an API token scoped to a project could not do.
#
# This runs only when started by hand, never on a push. Publishing a version
# is irreversible -- PyPI refuses a re-upload of the same name and version
# forever -- so it is not something a merge should be able to trigger.
name: publish trustband

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      # THE ARTIFACT IS TESTED, NOT THE WORKING TREE. A green suite run
      # against the repository says nothing about what the sdist actually
      # contains -- this project has already shipped a wheel that was missing
      # its policy packs, and an sdist carrying 30 unrelated test files.
      - name: install the sdist and walk the new-user path
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --no-binary :all: dist/*.tar.gz
          /tmp/v/bin/python -m trustband.conformance
          /tmp/v/bin/trustband packs
          /tmp/v/bin/trustband init --home /tmp/h
          /tmp/v/bin/trustband status --home /tmp/h

      # Refuse to publish work belonging to the other projects in this
      # repository. Cheap, and the failure it prevents is permanent.
      # WHAT SHIPS IS AN ALLOWLIST, NOT A DENY-LIST.
      #
      # This began as a list of sibling-project names to grep for. That is the
      # wrong shape twice over: it only catches the leaks someone remembered,
      # and the list itself discloses what it is hiding. An allowlist of paths
      # catches everything, including whatever lands here next, and names
      # nothing.
      - name: refuse to ship anything outside the package
        run: |
          mkdir -p /tmp/x && tar xzf dist/*.tar.gz -C /tmp/x
          unzip -q -o dist/*.whl -d /tmp/x/wheel
          fail=0

          cd /tmp/x/$(ls /tmp/x | grep -v wheel | head -1)
          while read -r f; do
            case "$f" in
              trustband/*|tests/test_claude_code_adapter.py|tests/test_mcp_proxy.py|\
              tests/test_tool_descriptions.py|tests/test_extractor_core.py|\
              pyproject.toml|MANIFEST.in|PKG-INFO|setup.cfg|*.egg-info/*) ;;
              *) echo "::error::sdist contains an unexpected path: $f"; fail=1 ;;
            esac
          done < <(find . -type f | sed 's|^\./||')
          cd /tmp/x

          # A build machine's filesystem layout is nobody else's business.
          if grep -rl -E '/Users/|/home/[a-z]|/Volumes/|/private/tmp/' /tmp/x; then
            echo "::error::artifact contains an absolute path"; fail=1
          fi

          # Credential shapes. Cheap, and unfixable once published.
          if grep -rlE 'pypi-AgEI|gh[pousr]_[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' /tmp/x; then
            echo "::error::artifact contains something credential-shaped"; fail=1
          fi

          # The README is the PyPI landing page. A pointer on it to a file that
          # does not ship reads as evidence and is not.
          for ref in $(grep -ohE '(docs/|scripts/)[A-Za-z0-9_./-]*\.(md|py)' \
                       /tmp/x/wheel/trustband/README.md || true); do
            echo "::error::README points at $ref, which does not ship"; fail=1
          done

          [ $fail -eq 0 ] && echo "clean" || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write            # the OIDC credential; this is the whole point
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi'
            && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
