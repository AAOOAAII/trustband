[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trustband"
version = "0.6.1"
description = "Provenance-aware authorization for LLM agent tool calls"
readme = "trustband/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Declared, not discovered. The default globs put LICENSE in the wheel and
# silently dropped NOTICE on one build; the NOTICE is the file that states
# what the licence does NOT grant, so its presence is checked at release.
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Luis Alonso Carranza"}]
# No dependencies. The enforcement core is standard library only, so there is
# nothing to trust beyond what you can read.
dependencies = []
keywords = ["llm", "agent", "security", "authorization", "prompt-injection",
            "provenance", "mcp", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The PyPI page is an acquisition surface. The source repository is a public
# mirror of this one, cut on an allowlist: code, tests, and every measurement
# gate and result, without internal planning documents.
[project.urls]
Homepage = "https://trust.band"
Repository = "https://github.com/AAOOAAII/trustband"
Changelog = "https://github.com/AAOOAAII/trustband/blob/main/CHANGELOG.md"

[project.scripts]
trustband = "trustband.cli:main"
trustband-hook = "trustband.adapters.claude_code:main"
trustband-mcp = "trustband.adapters.mcp_proxy:main"

[tool.setuptools]
packages = ["trustband", "trustband.adapters"]

[tool.setuptools.package-data]
# The measurement reports ship because every pack cites one. The source repo is
# private, so a repo-relative citation resolved nowhere for the people the
# citation exists to convince.
"trustband" = ["packs/*.json", "measurements/*.md"]
