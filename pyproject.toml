[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrantable"
version = "0.1.0"
description = "Provenance-aware authorization for LLM agent tool calls"
readme = "warrantable/README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# No dependencies. The enforcement core is standard library only, so there is
# nothing to trust beyond what you can read.
dependencies = []

[project.scripts]
warrantable = "warrantable.cli:main"
warrantable-hook = "warrantable.adapters.claude_code:main"
warrantable-mcp = "warrantable.adapters.mcp_proxy:main"

[tool.setuptools]
packages = ["warrantable", "warrantable.adapters"]
