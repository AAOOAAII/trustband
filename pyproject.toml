[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a sibling project"
version = "0.1.0"
description = "a sibling project Beta SDK — GDC-E rotation tenant isolation (private)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0",
    "faiss-cpu>=1.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
# `a sibling project*` is REQUIRED, not optional: a sibling project/rotation.py imports
# a sibling project.core.rotation at module level. Packaging a sibling project alone produced an
# install that reported success and then failed on `import a sibling project` from any
# directory other than the repo root, where a sibling project/ happens to be on sys.path.
include = ["a sibling project*", "a sibling project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: downloads models or runs heavy integration checks",
    "hybrid_transparency: canonical Jamba hybrid rotation-transparency regression",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
