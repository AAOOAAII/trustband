[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustband"
version = "0.2.0"
description = "Provenance-aware authorization for LLM agent tool calls"
readme = "trustband/README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# No dependencies. The enforcement core is standard library only, so there is
# nothing to trust beyond what you can read.
dependencies = []
keywords = ["llm", "agent", "security", "authorization", "prompt-injection",
            "provenance", "mcp", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The PyPI page is an acquisition surface and it linked nowhere. Only the
# product site goes here: the source repository is private, and a Project-URL
# that 404s is worse than an absent one.
[project.urls]
Homepage = "https://trust.band"

[project.scripts]
trustband = "trustband.cli:main"
trustband-hook = "trustband.adapters.claude_code:main"
trustband-mcp = "trustband.adapters.mcp_proxy:main"

[tool.setuptools]
packages = ["trustband", "trustband.adapters"]

[tool.setuptools.package-data]
"trustband" = ["packs/*.json"]
